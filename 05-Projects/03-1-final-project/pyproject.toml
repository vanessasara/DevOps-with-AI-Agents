[project]
name = "03-1-final-project"
version = "0.1.0"
description = "AI DevOps Incident Responder — multi-agent system using OpenAI Agents SDK + LiteLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.85.1",
    "openai-agents[litellm]>=0.0.19",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
